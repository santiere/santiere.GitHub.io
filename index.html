.rz-note{margin-top:5px;font-size:13px;font-weight:600;color:#8E44DD}.rz-t{color:#8E44DD;font-weight:600}
:root[data-theme="dark"] .rz-note,:root[data-theme="dark"] .rz-t{color:#C49BFF}
:root[data-theme="dark"] .qc-tile{background:var(--surface-2);border-color:#56626B}
:root[data-theme="dark"] .qc-s{color:var(--muted)}
:root[data-theme="dark"] .qc-n{background:#E6ECEE;color:#0F1417}
:root[data-theme="dark"] .qc-tile.done .qc-l,:root[data-theme="dark"] .qc-tile.done .qc-s,:root[data-theme="dark"] .qc-fixed .qc-l,:root[data-theme="dark"] .qc-fixed .qc-s{background:rgba(24,32,37,.9)}
:root[data-theme="dark"] .nav-fab{background:var(--surface);color:var(--ink)}
:root[data-theme="dark"] .geohelp-card{background:var(--surface)}
#btnTheme[aria-pressed="true"]{background:var(--surface)!important;color:#F5B82E!important}
html,body{height:100%}
body{background:var(--ground);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.4;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
#app{position:fixed;inset:0;overflow:hidden}
#map{position:absolute;inset:0;background:var(--ground)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

/* top bar */
.top{position:absolute;left:0;right:0;top:0;padding:calc(var(--sat) + 10px) 12px 0;display:flex;flex-direction:column;gap:8px;pointer-events:none;z-index:5}
.top>*{pointer-events:auto}
.search{display:flex;align-items:center;gap:8px;background:var(--surface);border-radius:999px;box-shadow:var(--shadow);padding:0 6px 0 14px;height:46px}
.search svg{flex:none;color:var(--muted)}
.search input{flex:1;min-width:0;border:0;background:transparent;font-size:16px;height:100%;outline:none}
.search select{border:0;background:var(--surface-2);border-radius:999px;height:34px;padding:0 10px;font-size:16px;max-width:44%;color:var(--ink)}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:13.5px;box-shadow:0 2px 8px rgba(0,0,0,.08)}
.chip .dot{width:9px;height:9px;border-radius:50%}
.chip[aria-pressed="false"]{opacity:.55;background:var(--surface-2)}
.chip b{font-weight:600;color:var(--muted)}

/* floating map buttons */
.fab-col{position:absolute;right:12px;top:calc(var(--sat) + 112px);display:flex;flex-direction:column;gap:8px;z-index:4}
.fab{width:44px;height:44px;border-radius:12px;border:0;background:var(--surface);box-shadow:var(--shadow);display:grid;place-items:center;color:var(--ink)}
html,body,button,a,input,label,.sheet,.tabs,.nav,.qc{touch-action:manipulation}
.fab-new{width:44px;padding:7px 0 6px;border-radius:12px;border:0;background:var(--amber);color:var(--amber-ink);font-size:9.5px;font-weight:700;line-height:1.1;display:flex;flex-direction:column;align-items:center;gap:3px;box-shadow:var(--shadow);margin-top:6px}
.fab-new:active{transform:scale(.95)}
.fab[aria-pressed="true"]{background:var(--amber);color:var(--amber-ink)}
.selbar{position:absolute;left:12px;right:12px;top:calc(var(--sat) + 112px);margin-right:56px;z-index:4;background:var(--amber);color:var(--amber-ink);border-radius:12px;padding:10px 12px;font-weight:600;font-size:14px;box-shadow:var(--shadow);display:flex;gap:10px;align-items:center;justify-content:space-between}
.selbar button{border:0;background:rgba(0,0,0,.12);border-radius:8px;padding:6px 10px;font-weight:600;color:inherit}

/* tab bar */
.tabs{position:absolute;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(3,1fr);padding-bottom:var(--sab)}
.tabs button{border:0;background:none;height:56px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11.5px;font-weight:600;color:var(--muted);position:relative}
.tabs button[aria-current="page"]{color:var(--ink)}
.tabs button[aria-current="page"] svg{color:var(--accent)}
.badge{position:absolute;top:6px;left:calc(50% + 6px);min-width:18px;height:18px;border-radius:9px;background:var(--amber);color:var(--amber-ink);font-size:11px;display:grid;place-items:center;padding:0 5px}

/* sheet */
.sheet{position:absolute;left:0;right:0;bottom:calc(56px + var(--sab));z-index:10;background:var(--surface);border-radius:18px 18px 0 0;box-shadow:0 -6px 30px rgba(0,0,0,.18);display:flex;flex-direction:column;max-height:calc(100% - 56px - var(--sab) - var(--sat) - 16px);transition:transform .22s ease}
.sheet.peek{max-height:min(52%,460px)}
.sheet.full{height:calc(100% - 56px - var(--sab) - var(--sat) - 104px)}
.grab{flex:none;height:22px;display:grid;place-items:center;border:0;background:none;width:100%}
.grab::before{content:"";width:40px;height:5px;border-radius:3px;background:var(--line)}
.sheet-body{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 16px 20px;flex:1}
@media (prefers-reduced-motion: reduce){.sheet{transition:none}}

/* typography */
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:.005em}
h2{font-size:22px;font-weight:700;line-height:1.15}
h3{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:18px 0 8px}
.sub{color:var(--muted);font-size:14px}
.row{display:flex;gap:8px;align-items:center}
.wrap{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.sp{justify-content:space-between}

/* status pill */
.pill{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 10px;border-radius:999px;font-size:12.5px;font-weight:600;white-space:nowrap}
.pill.due{background:color-mix(in srgb,var(--due) 16%,transparent);color:var(--due)}
.pill.wait{background:color-mix(in srgb,var(--wait) 16%,transparent);color:var(--wait)}
.pill.off{background:color-mix(in srgb,var(--off) 20%,transparent);color:var(--muted)}
.pill.due::before,.pill.wait::before,.pill.off::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor}
.pill.late{background:repeating-linear-gradient(-45deg,var(--amber) 0 6px,#1d1d1d 6px 12px);color:#fff;text-shadow:0 1px 1px #000}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:42px;padding:0 14px;border-radius:11px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:14.5px;text-decoration:none;color:var(--ink);white-space:nowrap}
.btn.primary{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.btn.amber{background:var(--amber);color:var(--amber-ink);border-color:var(--amber)}
.btn.ghost{border-color:var(--line);background:var(--surface-2)}
.btn.exit{background:var(--danger);border-color:var(--danger);color:#fff;font-weight:700;padding:0 14px;box-shadow:0 1px 4px rgba(0,0,0,.2)}
.btn.act{border:1.5px solid var(--ink);background:var(--surface);font-weight:700;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.btn.danger{color:var(--danger)}
.btn.sm{height:34px;padding:0 10px;font-size:13.5px;border-radius:9px}
.btn:disabled{opacity:.5}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.btns>.btn{flex:1 1 auto}

/* site card */
.card-head{display:flex;gap:12px;align-items:flex-start;padding-top:2px}
.thumb{flex:none;width:78px;height:104px;border-radius:10px;background:var(--surface-2) center/cover no-repeat;border:1px solid var(--line)}
.fill{display:block;width:100%;height:100%;background:center/cover no-repeat}
.meta{font-size:13.5px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:6px}
.meta span{white-space:nowrap}

/* panel-style detail header (mimics the site board) */
.board{border:2px solid var(--ink);border-radius:6px;padding:10px 12px 12px;margin-top:6px;background:var(--surface)}
.board .kicker{font-family:var(--f-display);font-weight:700;font-size:13px;letter-spacing:.14em;text-transform:uppercase;border-bottom:2px solid var(--ink);padding-bottom:6px;margin-bottom:8px;display:flex;justify-content:space-between;gap:8px}
.board .kicker{align-items:center;min-width:0}.board .kicker .kid{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.board .kicker .pill{flex:none;letter-spacing:.06em;font-size:11.5px}
.board dl{display:grid;grid-template-columns:minmax(92px,32%) 1fr;gap:6px 10px;margin:0;font-size:14px}
.board dt{color:var(--muted);font-size:12.5px;text-transform:uppercase;letter-spacing:.04em;padding-top:2px}
.board dd{margin:0;overflow-wrap:anywhere}
.auto{font-size:11.5px;color:var(--muted);font-style:italic}

/* photos strip */
.strip{display:flex;gap:8px;overflow-x:auto;padding:2px 0 6px;scroll-snap-type:x mandatory}
.ph{flex:none;width:118px;scroll-snap-align:start;border:0;padding:0;background:none;text-align:left}
.ph-split{display:flex;gap:10px;align-items:flex-start}.ph-pan{flex:none;padding-right:10px;border-right:1px solid var(--line)}.ph-split .strip{min-width:0}
.ph .img{display:block;width:118px;height:156px;border-radius:10px;background:var(--surface-2) center/cover no-repeat;border:1px solid var(--line)}
.ph .cap{font-size:12px;color:var(--muted);margin-top:4px}

/* timeline */
.tl{list-style:none;margin:0;padding:0;border-left:2px solid var(--line);margin-left:6px}
.tl li{position:relative;padding:0 0 14px 16px}
.tl li::before{content:"";position:absolute;left:-7px;top:4px;width:12px;height:12px;border-radius:50%;background:var(--surface);border:2px solid var(--ink)}
.tl .d{font-weight:600;font-size:14px}
.tl .s{font-size:13.5px;color:var(--muted)}

/* list */
.list{list-style:none;margin:0;padding:0}
.li{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.li button.main{flex:1;min-width:0;border:0;background:none;text-align:left;padding:0}
.li .t{font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .m{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.check{flex:none;width:34px;height:34px;border-radius:9px;border:1.5px solid var(--line);background:var(--surface);display:grid;place-items:center;font-weight:700;font-size:13px}
.check[aria-pressed="true"]{background:var(--amber);border-color:var(--amber);color:var(--amber-ink)}
.seg{display:flex;background:var(--surface-2);border-radius:10px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:none;border-radius:8px;height:32px;font-weight:600;font-size:13px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}

/* route */
.stop{display:grid;grid-template-columns:30px 1fr auto;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
.stop .n{width:28px;height:28px;border-radius:50%;background:var(--amber);color:var(--amber-ink);display:grid;place-items:center;font-weight:700;font-size:13px}
.stop.done .n{background:var(--ok);color:#fff}
.stop.done .t{text-decoration:line-through;color:var(--muted)}
.stop .t{font-weight:600;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stop .m{font-size:12.5px;color:var(--muted)}
.mini{display:flex;gap:4px}
.mini button{width:32px;height:32px;border-radius:8px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;padding:0}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}
.stat{background:var(--surface-2);border-radius:10px;padding:8px 10px}
.stat b{display:block;font-family:var(--f-display);font-size:22px;font-weight:700;line-height:1.1}
.stat span{font-size:12px;color:var(--muted)}
.leg{display:flex;gap:8px;align-items:center;justify-content:space-between;padding:8px 0}

/* forms */
label.f{display:block;margin-top:12px}
label.f>span{display:block;font-size:12.5px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:5px}
.in{width:100%;border:1px solid var(--line);background:var(--surface-2);border-radius:10px;padding:10px 12px;font-size:16px;box-sizing:border-box}
textarea.in{min-height:76px;resize:vertical}
.drop{display:flex;align-items:center;justify-content:center;gap:10px;border:1.5px dashed var(--line);border-radius:12px;padding:16px;color:var(--muted);font-weight:600;background:var(--surface-2);position:relative;text-align:center}
.drop input{position:absolute;inset:0;opacity:0;cursor:pointer}
.previews{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.previews img{width:64px;height:64px;object-fit:cover;border-radius:8px;border:1px solid var(--line)}
.note{background:var(--surface-2);border-radius:10px;padding:10px 12px;font-size:13.5px;color:var(--muted)}
.warn{background:color-mix(in srgb,var(--amber) 22%,transparent);color:var(--ink)}
details.ocr summary{cursor:pointer;font-weight:600;font-size:14px;padding:8px 0}
details.ocr pre{white-space:pre-wrap;font-family:ui-monospace,Menlo,monospace;font-size:12px;background:var(--surface-2);padding:10px;border-radius:10px;max-height:260px;overflow:auto;margin:0}

/* road route + navigation */
details.legd{border-bottom:1px solid var(--line)}
details.legd summary{display:flex;gap:10px;align-items:center;padding:10px 0;cursor:pointer;list-style:none}
details.legd summary::-webkit-details-marker{display:none}
details.legd .n{flex:none;width:26px;height:26px;border-radius:50%;background:var(--amber);color:var(--amber-ink);display:grid;place-items:center;font-weight:700;font-size:12.5px}
ol.steps{list-style:none;margin:0 0 10px;padding:0 0 0 36px}
ol.steps li{display:flex;gap:10px;align-items:center;padding:6px 0;font-size:14px;border-top:1px dashed var(--line)}
ol.steps .mi{flex:none;color:var(--ink)}
.nav{position:absolute;inset:0;z-index:30;pointer-events:none;display:flex;flex-direction:column;justify-content:space-between}
.nav>*{pointer-events:auto}
.nav-topbox{--nav-bg:#13202A;background:#13202A;color:#fff;padding:calc(var(--sat) + 12px) 14px 10px;box-shadow:0 6px 24px rgba(0,0,0,.3)}
.nav-top{display:flex;gap:14px;align-items:center}
.nav-ic{flex:none;width:60px;height:60px;border-radius:14px;background:rgba(255,255,255,.1);display:grid;place-items:center;color:#fff}
.nav-dist{font-family:var(--f-display);font-weight:700;font-size:30px;line-height:1}
.nav-txt{font-size:17px;font-weight:600;margin-top:4px;line-height:1.25}
.nav-then{margin-top:10px;padding-top:8px;border-top:1px solid rgba(255,255,255,.15);font-size:14px;color:#C9D6DF;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.nav-then .mi{color:#fff}
.nav-bot{background:var(--surface);padding:12px 14px calc(var(--sab) + 12px);border-radius:18px 18px 0 0;box-shadow:0 -6px 24px rgba(0,0,0,.2)}
.nav-eta{font-weight:700;font-size:16px}
.selfab{position:absolute;right:12px;bottom:calc(68px + var(--sab));z-index:6;border:0;border-radius:999px;background:var(--amber);color:var(--amber-ink);font-weight:700;font-size:15px;height:48px;padding:0 18px;box-shadow:var(--shadow)}
#sheet:not([hidden]) ~ .selfab,.nav:not([hidden]) ~ .selfab{display:none}
.selfab[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.drop.shot{justify-content:flex-start;gap:12px;padding:10px 12px;text-align:left}
.drop.shot img{width:56px;height:56px;object-fit:cover;border-radius:8px;flex:none}
.drop.shot .num{width:56px;height:56px;border-radius:8px;background:var(--surface);display:grid;place-items:center;flex:none;color:var(--ink)}
.me{width:22px;height:22px;position:relative}
.me-dot{position:absolute;inset:3px;border-radius:50%;background:#1A73E8;border:3px solid #fff;box-shadow:0 0 0 7px rgba(26,115,232,.22),0 1px 4px rgba(0,0,0,.4)}
.me-cone{display:none;position:absolute;left:50%;bottom:50%;width:0;height:0;margin-left:-14px;border-left:14px solid transparent;border-right:14px solid transparent;border-bottom:34px solid rgba(26,115,232,.28)}
.fab[aria-pressed="true"]#btnMe{background:#1A73E8;color:#fff}
#btnMe.seeking svg{animation:seek 1.2s ease-in-out infinite}@keyframes seek{50%{opacity:.25}}
.me-acc{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);border-radius:50%;background:rgba(26,115,232,.12);border:1px solid rgba(26,115,232,.35);pointer-events:none}
.geohelp{position:fixed;inset:0;z-index:90;background:rgba(15,20,25,.45);display:flex;align-items:flex-end;justify-content:center;padding:12px}
.geohelp-card{background:var(--bg,#fff);color:var(--ink,#111);border-radius:18px;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px));width:100%;max-width:480px;box-shadow:0 10px 40px rgba(0,0,0,.3)}
.geohelp-card h2{margin:4px 0 8px;font-size:19px}.geohelp-steps{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:8px;font-size:15px;line-height:1.35}
.nav-side{position:absolute;right:12px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:10px;pointer-events:auto}
.nav-fab{width:52px;height:52px;border-radius:14px;border:0;background:#fff;color:#13202A;font-size:30px;font-weight:600;line-height:1;box-shadow:0 2px 10px rgba(0,0,0,.28)}
.nav-fab:active,.nav-new:active{transform:scale(.95)}
.nav-new{width:52px;padding:8px 0 6px;border-radius:14px;border:0;background:#F0A202;color:#13202A;font-size:10.5px;font-weight:700;line-height:1.1;display:flex;flex-direction:column;align-items:center;gap:3px;box-shadow:0 2px 10px rgba(0,0,0,.28)}
.qc{position:fixed;inset:0;z-index:60;background:rgba(15,20,25,.5);display:flex;align-items:flex-end;justify-content:center}
.qc-card{background:var(--surface,#fff);color:var(--ink,#111);width:100%;max-width:520px;border-radius:20px 20px 0 0;padding:16px 16px calc(var(--sab,0px) + 16px);box-shadow:0 -10px 40px rgba(0,0,0,.3)}
.qc-tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.qc-tile{position:relative;aspect-ratio:3/4;border-radius:14px;border:2px dashed #9AA3AB;background:#F3F4F2;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;overflow:hidden;text-align:center;padding:8px}
.qc-tile.done{border:2px solid #1E8E3E}
.qc-tile img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.qc-tile.done .qc-l,.qc-tile.done .qc-s{position:relative;z-index:1;background:rgba(255,255,255,.9);border-radius:6px;padding:2px 6px}
.qc-fixed{border-style:solid;border-color:#13202A}.qc-fixed .qc-l,.qc-fixed .qc-s{position:relative;z-index:1;background:rgba(255,255,255,.9);border-radius:6px;padding:2px 6px}
.qc-tile input{position:absolute;inset:0;opacity:0}
.qc-n{width:52px;height:52px;border-radius:50%;background:#13202A;color:#fff;font-size:21px;font-weight:700;display:grid;place-items:center}
.qc-l{font-weight:700;font-size:16px}.qc-s{font-size:12px;color:#5B6570}
.qc-big{width:100%;height:52px;font-size:16px;margin-top:10px}
.areabar{position:absolute;left:12px;right:12px;bottom:calc(var(--sab,0px) + 76px);z-index:6;background:var(--surface,#fff);color:var(--ink);border-radius:16px;padding:12px;box-shadow:0 8px 30px rgba(0,0,0,.28);display:flex;flex-direction:column;gap:10px}
.areabar b{display:block;font-size:16px}.areabar span{display:block;font-size:22px;font-weight:700;margin-top:2px}.areabar small{display:block;color:#5B6570;font-size:12.5px;margin-top:2px}
.areabar ~ .selfab{display:none}.areabar:not([hidden]) ~ .selfab{display:none}
.qc-site{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:0 0 10px;font-size:15px}.qc-site .btn{margin-left:auto}
.qc-gps{margin-top:10px;font-size:14px;font-weight:600}.qc-gps.ok{color:#1E8E3E}.qc-gps.wait{color:#B3261E}
.qc-ok{font-size:22px;font-weight:700;color:#1E8E3E;margin:6px 0}
.stage-off{opacity:1;background:color-mix(in srgb,var(--wait) 12%,var(--surface));color:var(--wait);border:1px solid color-mix(in srgb,var(--wait) 35%,transparent)}
@media (orientation: landscape) and (max-height: 600px) {
  .top{right:auto;width:min(540px,52vw);padding-left:calc(var(--sal) + 10px);padding-top:calc(var(--sat) + 6px);gap:6px}
  .fab-col{top:calc(var(--sat) + 10px);right:calc(var(--sar) + 10px);display:flex;flex-direction:column;gap:6px}
  .fab{width:40px;height:40px;border-radius:11px}
  .fab-new{width:40px;padding:6px 0 5px;font-size:9px;margin-top:2px;border-radius:11px}.fab-new svg{width:17px;height:17px}

<script>
/* ============ road router (edge-based Dijkstra on an OSM drivable graph) ============ */
const Router = (() => {
  let G = null; const graphs = {}; let T = null, TURN = 1;
  const TYPES = { uint32: Uint32Array, int32: Int32Array, uint16: Uint16Array, uint8: Uint8Array, int8: Int8Array };
  const DEG = 360 / 256;
  const CELL = 0.004; // ~400 m grid for snapping

  function init(buf, meta, key) {
    const P = {};
    for (const p of meta.parts) P[p.k] = new TYPES[p.t](buf, p.o, p.n);
    const NV = meta.NV, NA = meta.NA;
    const from = new Uint32Array(NA);
    for (let v = 0; v < NV; v++) for (let a = P.first[v]; a < P.first[v + 1]; a++) from[a] = v;
    const restr = new Map();
    for (let i = 0; i < P.restr.length; i += 3) {
      const f = P.restr[i], t = P.restr[i + 1], only = P.restr[i + 2];
      if (!restr.has(f)) restr.set(f, { only: [], no: [] });
      (only ? restr.get(f).only : restr.get(f).no).push(t);
    }
    const edgeArcs = new Map();
    for (let a = 0; a < NA; a++) { const e = P.edge[a]; const l = edgeArcs.get(e); if (l) l.push(a); else edgeArcs.set(e, [a]); }
    // grid index of edges (one representative arc per edge)
    const grid = new Map();
    for (const [e, arcs] of edgeArcs) {
      const a = arcs[0]; const cls = P.cls[a] & 15; if (cls === 1) continue; // never snap onto motorways
      const pts = arcPts(P, from, a); let minX = 1e9, minY = 1e9, maxX = -1e9, maxY = -1e9;
      for (const [lat, lng] of pts) { minX = Math.min(minX, lng); maxX = Math.max(maxX, lng); minY = Math.min(minY, lat); maxY = Math.max(maxY, lat); }
      for (let gx = Math.floor(minX / CELL); gx <= Math.floor(maxX / CELL); gx++) for (let gy = Math.floor(minY / CELL); gy <= Math.floor(maxY / CELL); gy++) {
        const k = gx * 100000 + gy; const l = grid.get(k); if (l) l.push(e); else grid.set(k, [e]);
      }
    }
    G = Object.assign(P, { NV, NA, from, restr, edgeArcs, grid, names: meta.names,
      dist: new Float64Array(NA).fill(Infinity), prev: new Int32Array(NA).fill(-1), touched: [] });
    graphs[key || 'car'] = G; T = G.time; TURN = 1;

function routeStats(stops) {
  let km = 0; let prev = S.me || null;
  for (const s of stops) { if (prev) km += hav(prev, s); prev = s; }
  const road = km * 1.35; const min = road / 24 * 60 + stops.length * 7;
  return { road, min };
}
function gLegs(stops, start) {
  const legs = []; let origin = start || null;
  for (let i = 0; i < stops.length; i += 10) {
    const ch = stops.slice(i, i + 10); const dest = ch[ch.length - 1]; const w = ch.slice(0, -1);
    let u = 'https://www.google.com/maps/dir/?api=1&travelmode=driving&destination=' + ll(dest);
    if (origin) u += '&origin=' + ll(origin);
    if (w.length) u += '&waypoints=' + w.map(ll).join('%7C');
    legs.push({ a: i + 1, b: i + ch.length, u }); origin = dest;
  }
  return legs;
}

function solveOrder(C, fixed) {

      outer: for (let i = 1; i < m - 1; i++) for (let j = i + 1; j < m; j++) {
        const nx = j + 1 < m ? o[j + 1] : -1;
        const before = C[o[i - 1]][o[i]] + (F[j] - F[i]) + (nx >= 0 ? C[o[j]][nx] : 0);
        const after = C[o[i - 1]][o[j]] + (B[j] - B[i]) + (nx >= 0 ? C[o[i]][nx] : 0);

  if (c.heading != null && !isNaN(c.heading) && (c.speed == null || c.speed > 1.5)) brg = c.heading;
  else if (pr.d <= limit) { const i2 = Math.min(L.coords.length - 1, pr.i + 1); brg = bearingTo(L.coords[pr.i], L.coords[i2]); }
  // steady direction: ignore tiny wobbles, soften the rest
  if (S.navBrg != null) { const d = ((brg - S.navBrg + 540) % 360) - 180; brg = Math.abs(d) < 3 ? S.navBrg : S.navBrg + d * 0.6; }
  brg = (brg + 360) % 360; S.navBrg = brg;
  if (S.meMarker) S.meMarker.setRotation(brg);
  if (map && !S.navFree) {
    const top = $('#navTopBox').getBoundingClientRect().height + 20, bot = $('#navBot').getBoundingClientRect().height + 20;
    map.easeTo({ center: [c.longitude, c.latitude], bearing: brg, zoom: navSpeedZoom(c), pitch: 50, padding: navPad(top, bot, 120), duration: quiet ? 400 : dur, easing: t => t });
  }
}

/* ---------- zoom follows the speed (like Waze): farther out when driving fast, back in when slowing down ---------- */
function navSpeedZoom(c) {
  const now = Date.now(), sp0 = S.navSpd || { v: 0, lat: c.latitude, lng: c.longitude, t: now };
  let v = c.speed != null && !isNaN(c.speed) && c.speed >= 0 ? c.speed : null;   // m/s from the phone
  if (v == null && now - sp0.t > 500) v = Router.hav([sp0.lat, sp0.lng], [c.latitude, c.longitude]) / ((now - sp0.t) / 1000);
  const ema = v == null ? sp0.v : sp0.v * 0.6 + v * 0.4;   // smoothed, so the map doesn't pump at every fix
  S.navSpd = { v: ema, lat: c.latitude, lng: c.longitude, t: now };
  const kmh = ema * 3.6;
  // 0–20 km/h: your own zoom; then out by up to 2.2 levels around 80 km/h
  let dz = Math.max(0, Math.min(2.2, (kmh - 20) / 27));
  if (S.navDz != null && Math.abs(dz - S.navDz) < 0.3) dz = S.navDz; else S.navDz = dz;
  return (S.navZoom || 17) - dz;
}

/* ---------- looking around during navigation (like Waze): back to my position after 12 s without touching ---------- */
const NAV_FREE_MS = 12000;
function navFreeStart() { if (!S.navOn) return; S.navFree = true; const b = $('#navRecenter'); if (b) b.hidden = false; navFreeArm(); }
function navFreeArm() { clearTimeout(S.navFreeT); S.navFreeT = setTimeout(navRecenter, NAV_FREE_MS); }
function navRecenter() {
  clearTimeout(S.navFreeT); S.navFree = false; const b = $('#navRecenter'); if (b) b.hidden = true;
  if (S.navOn && S.me) navGps({ latitude: S.me.lat, longitude: S.me.lng, heading: S.me.heading, speed: S.me.speed, accuracy: S.me.acc }, true);
}

/* ---------- navigate straight to one site ---------- */
async function navTo(id) {
  if (!gpsFresh()) { toast('Aștept locația GPS…'); if (typeof locateNow === 'function') locateNow(); return; }
  S.route = { stops: [id], done: [], start: null, name: '' }; saveRouteSoon();
  closeSheet(); await computeRoute(false);
  if (navValid()) navStart(); else toast('Nu am putut calcula drumul');
}

// map padding so the car sits in the free part of the screen (right side in landscape)
function navPad(top, bot, extra) {
  if (innerWidth > innerHeight && innerHeight < 600) { const hb = $('#navBot').getBoundingClientRect().height; return { top: hb + Math.round(innerHeight * 0.15), bottom: 20, left: 70, right: 70 }; }
  const hb = $('#navBot').getBoundingClientRect().height; const hp = $('#navProg').getBoundingClientRect().height; return { top: hb + Math.round(innerHeight * 0.3), bottom: 40 + hp + extra / 2, left: 0, right: 0 };
}
window.addEventListener('resize', () => { if (S.navOn && S.me) setTimeout(() => navGps({ latitude: S.me.lat, longitude: S.me.lng, heading: S.me.heading, speed: S.me.speed, accuracy: S.me.acc }, true), 250); });

/* progress along the whole route: stops reached + share of the distance already driven */
function navProg(leg, remD) {
  const box = $('#navProg'); if (!box || !S.nav) return;
  const n = S.nav.legs.length, tot = Math.max(S.navTot || 0, 1);
  leg = Math.max(leg, S.nav.legs.filter(l => S.route.done.includes(l.to)).length);
  const pct = Math.max(0, Math.min(100, Math.round(100 * (1 - remD / tot))));
  $('#npFill').style.setProperty('--p', pct + '%');
  $('#npStops').textContent = Math.min(leg, n) + '/' + n;
  $('#npPct').textContent = pct + '%';
  box.setAttribute('aria-label', 'Progres traseu: ' + Math.min(leg, n) + ' din ' + n + ' șantiere, ' + pct + '%');
}

/* ---------- if iOS reloaded the app while navigating (it does that after a while in the background), pick up where we were ---------- */
(() => {
  let t = 0; try { t = +localStorage.getItem('harta_nav') || 0; } catch (e) {}
  if (!t || Date.now() - t > 3 * 3600e3) return;
  let n = 0;
  const tryResume = () => {
    if (S.navOn) return;
    const pend = S.route && S.route.stops.some(id => !S.route.done.includes(id));
    if (S.loaded && S.me && pend && S.sites.size) {
      computeRoute(false).then(() => { if (navValid() && !S.navOn) { navStart(); toast('Am reluat navigarea'); } }).catch(() => {});
    } else if (++n < 45) setTimeout(tryResume, 1000);
  };
  setTimeout(tryResume, 1500);
})();

/* ============ Activity: sites checked, km driven, time in the field (recorded on this phone) ============ */
const ACT = {
  z: {}, loaded: false, dirty: false, last: null, mode: 'z', sel: null,
  async load() {
    if (!db) return;
    try { const sn = await db.doc('activ/zile').get(); ACT.z = (sn.exists && sn.data().z) || {}; } catch (e) { ACT.z = {}; }
    ACT.loaded = true; if (S.view === 'activ') render();
  },
  day(d) { return ACT.z[d] || (ACT.z[d] = { ids: {}, m: 0, s: 0 }); },
  async save() {
    if (!db || !ACT.loaded || !ACT.dirty) return; ACT.dirty = false;
    try { await db.doc('activ/zile').set({ z: ACT.z }); } catch (e) { ACT.dirty = true; }
  },
  // a site updated (or created) today; counted once per site per day
  site(sid, nou) {
    const z = ACT.day(today()); if (!z.ids[sid] || nou) z.ids[sid] = nou ? 'n' : 'u';
    ACT.dirty = true; ACT.save(); if (S.view === 'activ') render();
  },
  // distance: only accurate fixes, ignoring GPS jitter and jumps
  gps(c) {
    if (!ACT.loaded || c.accuracy > 35) return;
    const now = Date.now(); const p = { lat: c.latitude, lng: c.longitude };
    if (!ACT.last || now - ACT.last.t > 600000) { ACT.last = { lat: p.lat, lng: p.lng, t: now }; return; }
    const d = hav(ACT.last, p) * 1000; const v = d / Math.max(1, (now - ACT.last.t) / 1000);
    if (d >= Math.max(25, c.accuracy) && v < 45) { ACT.day(today()).m += d; ACT.last = { lat: p.lat, lng: p.lng, t: now }; ACT.dirty = true; }
    else if (v >= 45) ACT.last = { lat: p.lat, lng: p.lng, t: now };
  },
};
// time in the field: every 30 s while the app is open with a live GPS fix
setInterval(() => {
  if (!ACT.loaded || document.visibilityState !== 'visible' || !S.me || Date.now() - (S.me.t || 0) > 120000) return;
  ACT.day(today()).s += 30; ACT.dirty = true;
}, 30000);
setInterval(() => ACT.save(), 60000);
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') { ACT.save(); ACT.push(); } });
// km and time go to the cloud too, so Ionuț sees every operator's activity (the sites are counted there from the photos)
ACT.push = async () => {
  if (!ACT.loaded || typeof CLOUD === 'undefined') return;
  const z = {}; for (let i = 0; i < 7; i++) { const d = addDays(today(), -i); const v = ACT.z[d]; if (v && (v.m || v.s)) z[d] = { m: Math.round(v.m || 0), s: Math.round(v.s || 0) }; }
  if (!Object.keys(z).length) return;
  try { await CLOUD.req('/act', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ z }) }); } catch (e) {}
};
setInterval(() => ACT.push(), 300000);
// admin: everyone's activity and the list of operators
ACT.who = 'me'; ACT.remote = null; ACT.ops = null;
// what the server knows about my own activity (e.g. after logging in on this phone again): merged into the local copy
ACT.mergeServer = async () => {
  try {
    const me = window.PWA_me; if (!me || !ACT.loaded) return;
    const u = ((await CLOUD.req('/act')).users || {})[me.id]; if (!u || !u.z) return;
    for (const [d, v] of Object.entries(u.z)) { const z = ACT.day(d); Object.assign(z.ids, v.ids || {}); z.m = Math.max(z.m || 0, v.m || 0); z.s = Math.max(z.s || 0, v.s || 0); }
    ACT.dirty = true; ACT.save(); if (S.view === 'activ') render();
  } catch (e) {}
};
ACT.fetch = async () => {
  try { ACT.remote = (await CLOUD.req('/act')).users || {}; } catch (e) { ACT.remote = ACT.remote || {}; ACT.remoteErr = 1; }
  try { ACT.ops = (await CLOUD.req('/users')).users || []; } catch (e) { ACT.ops = ACT.ops || []; }
  if (S.view === 'activ') render();
};
function actTotals(zmap, key, mode) { const b = actBuckets(mode, zmap).find(x => x.k === key); return b || { u: 0, n: 0, m: 0, s: 0 }; }

const ZILE_S = ['Dum', 'Lun', 'Mar', 'Mie', 'Joi', 'Vin', 'Sâm'];
function weekStart(d) { const x = pISO(d); const k = (x.getDay() + 6) % 7; x.setDate(x.getDate() - k); return iso(x); }
function actBuckets(mode, zmap) {
  const t = today(); const out = [];
  if (mode === 'z') for (let i = 13; i >= 0; i--) { const d = addDays(t, -i); out.push({ k: d, x: String(+d.slice(8, 10)), lab: ZILE_S[pISO(d).getDay()] + ' ' + roShort(d).replace(/ \d{4}$/, '') }); }
  else if (mode === 's') { const w0 = weekStart(t); for (let i = 11; i >= 0; i--) { const w = addDays(w0, -7 * i); out.push({ k: w, x: String(+w.slice(8, 10)), lab: 'Săpt. ' + roShort(w).replace(/ \d{4}$/, '') + ' – ' + roShort(addDays(w, 6)).replace(/ \d{4}$/, '') }); } }
  else { const d = pISO(t); for (let i = 11; i >= 0; i--) { const m = new Date(d.getFullYear(), d.getMonth() - i, 1); const k = iso(m).slice(0, 7); out.push({ k, x: LUNI[m.getMonth()], lab: LUNI[m.getMonth()] + ' ' + m.getFullYear() }); } }
  const idx = {}; out.forEach((b, i) => { idx[b.k] = i; b.u = 0; b.n = 0; b.m = 0; b.s = 0; });
  for (const [d, z] of Object.entries(zmap || ACT.z)) {
    const k = mode === 'z' ? d : mode === 's' ? weekStart(d) : d.slice(0, 7);
    const b = out[idx[k]]; if (!b) continue;
    for (const v of Object.values(z.ids || {})) v === 'n' ? b.n++ : b.u++;
    b.m += z.m || 0; b.s += z.s || 0;
  }
  return out;
}
const hm = s => { const m = Math.round(s / 60); return m < 60 ? m + ' min' : Math.floor(m / 60) + 'h ' + pad(m % 60) + 'm'; };
const km = m => (m / 1000).toFixed(m >= 100000 ? 0 : 1).replace('.', ',');
function actChart(bs, sel) {
  const W = Math.max(280, Math.min(620, ($('#body') && $('#body').clientWidth || 360) - 8)), H = 190, pl = 26, pr = 6, pt = 12, pb = 24;
  const max = Math.max(4, ...bs.map(b => b.u + b.n)); const step = Math.ceil(max / 4); const top = step * 4;
  const y = v => pt + (H - pt - pb) * (1 - v / top); const cw = (W - pl - pr) / bs.length; const bw = Math.min(26, cw * 0.62);
  const topRound = (x, y0, w, h, r) => { r = Math.min(r, h, w / 2); return `M${x},${y0 + h}V${y0 + r}Q${x},${y0} ${x + r},${y0}H${x + w - r}Q${x + w},${y0} ${x + w},${y0 + r}V${y0 + h}Z`; };
  let g = '';
  for (let v = 0; v <= top; v += step * 2) g += `<line x1="${pl}" x2="${W - pr}" y1="${y(v)}" y2="${y(v)}" class="ch-grid"/><text x="${pl - 6}" y="${y(v) + 4}" class="ch-ax" text-anchor="end">${v}</text>`;
  let bars = '', hits = '', lbl = '', hl = '';
  bs.forEach((b, i) => {
    const x = pl + cw * i + (cw - bw) / 2; const tot = b.u + b.n;
    if (b.u) { const hu = y(0) - y(b.u); bars += b.n ? `<rect x="${x}" y="${y(b.u)}" width="${bw}" height="${hu}" class="ch-u"/>` : `<path d="${topRound(x, y(b.u), bw, hu, 4)}" class="ch-u"/>`; }
    if (b.n) { const y1 = y(tot), h = y(b.u) - y1 - (b.u ? 2 : 0); if (h > 0) bars += `<path d="${topRound(x, y1, bw, h, 4)}" class="ch-n"/>`; }
    const show = bs.length <= 14 ? (i % 2 === bs.length % 2 || i === bs.length - 1) : true;
    if (show || i === sel) lbl += `<text x="${x + bw / 2}" y="${H - 7}" class="ch-ax${i === sel ? ' on' : ''}" text-anchor="middle">${esc(b.x)}</text>`;
    if (i === sel && tot) lbl += `<text x="${x + bw / 2}" y="${y(tot) - 5}" class="ch-val" text-anchor="middle">${tot}</text>`;
    if (i === sel) hl = `<rect x="${pl + cw * i}" y="0" width="${cw}" height="${H - pb + 4}" rx="6" class="ch-hl"/>`;
    hits += `<rect x="${pl + cw * i}" y="0" width="${cw}" height="${H}" class="ch-hit" data-act="actBar" data-i="${i}"/>`;
  });
  return `<svg class="ch" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="Șantiere verificate pe perioadă">${hl}${g}${bars}${lbl}${hits}</svg>`;
}
function viewActiv() {
  if (!ACT.loaded) { ACT.load(); return '<div class="empty">Se încarcă activitatea…</div>'; }
  const admin = !isOp();
  if (admin && !ACT.remote && !ACT.fetching) { ACT.fetching = 1; ACT.fetch().then(() => { ACT.fetching = 0; }); }
  const R = ACT.remote || {};
  const people = admin ? [['me', 'Eu']].concat(Object.entries(R).filter(([id, u]) => id !== 'admin' && !u.gone).map(([id, u]) => [id, u.name])) : [];
  if (!people.some(p => p[0] === ACT.who)) ACT.who = 'me';
  const zmap = ACT.who === 'me' ? ACT.z : (R[ACT.who] && R[ACT.who].z) || {};
  const mode = ACT.mode; const bs = actBuckets(mode, zmap);
  const sel = ACT.sel != null && ACT.sel < bs.length ? ACT.sel : bs.length - 1; const b = bs[sel];
  const cur = { z: 'Azi', s: 'Săptămâna aceasta', l: 'Luna aceasta' }[mode];
  const title = sel === bs.length - 1 ? cur : b.lab;
  const seg = (k, l) => `<button class="state-opt${mode === k ? ' on' : ''}" data-act="actMode" data-v="${k}" aria-pressed="${mode === k}"><b>${l}</b></button>`;
  const rows = bs.slice().reverse().filter(r => r.u + r.n || r.m > 50 || r.s >= 60);
  const any = Object.keys(zmap).length;
  const whoSeg = people.length > 1 ? `<div class="who-seg" role="group" aria-label="Persoană">${people.map(([id, n]) => `<button class="chip${ACT.who === id ? ' on' : ''}" data-act="actWho" data-v="${esc(id)}" aria-pressed="${ACT.who === id}">${esc(n)}</button>`).join('')}</div>` : '';
  const team = admin && people.length > 1 ? `<h3>Toți · ${esc(title)}</h3>
  <table class="act-tab"><thead><tr><th>Persoană</th><th class="num">Verificate</th><th class="num">Noi</th><th class="num">Km</th><th class="num">Timp</th></tr></thead>
  <tbody>${people.map(([id, n]) => { const t = actTotals(id === 'me' ? ACT.z : (R[id] && R[id].z) || {}, b.k, mode); return `<tr><td>${esc(n)}</td><td class="num">${t.u + t.n}</td><td class="num">${t.n}</td><td class="num">${km(t.m)}</td><td class="num">${t.s >= 60 ? hm(t.s) : '—'}</td></tr>`; }).join('')}</tbody></table>` : '';
  const opsBox = admin ? `<h3>Operatori</h3>
  ${(ACT.ops || []).map(o => `<div class="op-row"><div class="grow"><b>${esc(o.name)}</b><div class="sub">adăugat ${o.c ? roDate(new Date(o.c).toISOString().slice(0, 10)) : ''}</div></div><button class="btn sm ghost danger" data-act="opDel" data-id="${esc(o.id)}">Scoate accesul</button></div>`).join('') || `<div class="sub">${ACT.ops ? 'Niciun operator încă.' : 'Se încarcă…'}</div>`}
  <div class="note" style="margin-top:10px"><b style="color:var(--ink)">Adaugă operator</b>
    <input class="in" id="opName" placeholder="Nume, ex. Operator 1" autocomplete="off" style="margin-top:8px">
    <div class="row" style="gap:8px;margin-top:8px"><input class="in grow" id="opPass" placeholder="Parola lui, ex. Operator1-4827" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false"><button class="btn sm" data-act="opGen">Generează</button></div>
    <button class="btn amber" style="width:100%;margin-top:8px" data-act="opAdd">Adaugă</button>
    <div class="sub" style="margin-top:6px">Parola: minim 10 caractere, cu litere și cifre (ex. Operator1-4827). Operatorul deschide aplicația pe telefonul lui și scrie parola asta. Poate naviga, fotografia și adăuga șantiere noi; nu poate șterge sau edita nimic.</div></div>` : '';
  const me = window.PWA_me && window.PWA_me.name;
  return `<div class="row sp"><h2>Activitate</h2>${admin ? '<button class="btn sm act" data-act="actRefresh" aria-label="Aduce datele noi" title="Aduce datele noi">↻ Actualizează</button>' : ''}</div>
  <div class="who-bar"><span>Conectat${me ? ' ca <b>' + esc(me) + '</b>' : ''}</span><button class="btn sm act" data-act="logout">Ieși din cont</button></div>
  ${whoSeg}
  <div class="act-seg" role="group" aria-label="Perioadă">${seg('z', 'Zile')}${seg('s', 'Săptămâni')}${seg('l', 'Luni')}</div>
  <div class="act-per">${esc(title)}</div>
  <div class="act-tiles">
    <div class="act-tile hero"><b class="num">${b.u + b.n}</b><span>șantiere verificate</span><small>${b.n ? `din care <b>${b.n}</b> ${b.n === 1 ? 'nou' : 'noi'}` : 'niciun șantier nou'}</small></div>
    <div class="act-tile"><b class="num">${km(b.m)}</b><span>km parcurși</span></div>
    <div class="act-tile"><b class="num">${hm(b.s)}</b><span>timp pe teren</span></div>
  </div>
  <div class="ch-legend"><span><i class="sw u"></i>Actualizate</span><span><i class="sw n"></i>Noi</span><span class="sub">Atinge o bară pentru detalii</span></div>
  <div class="ch-wrap">${actChart(bs, sel)}</div>
  ${team}
  ${any ? `<h3>Detaliu</h3>
  <table class="act-tab"><thead><tr><th>${{ z: 'Zi', s: 'Săptămână', l: 'Lună' }[mode]}</th><th class="num">Verificate</th><th class="num">Noi</th><th class="num">Km</th><th class="num">Timp</th></tr></thead>
  <tbody>${rows.map(r => `<tr><td>${esc(r.lab)}</td><td class="num">${r.u + r.n}</td><td class="num">${r.n}</td><td class="num">${km(r.m)}</td><td class="num">${r.s >= 60 ? hm(r.s) : '—'}</td></tr>`).join('') || '<tr><td colspan="5" class="sub">Nimic în această perioadă.</td></tr>'}</tbody></table>`
    : '<div class="note" style="margin-top:12px">Activitatea se înregistrează automat: fiecare șantier actualizat sau adăugat, kilometrii și timpul cât aplicația e deschisă cu GPS.</div>'}
  <div class="sub" style="margin-top:10px">${ACT.who === 'me' ? 'Kilometrii și timpul sunt măsurați de acest telefon.' : 'Șantierele se numără din pozele urcate; km și timpul vin de pe telefonul operatorului.'}</div>
  ${opsBox}
  <div style="height:10px"></div>`;
}

/* ============ boot ============ */
function boot() {
  const ok = initMap();
  if (!ok) { $('#map').innerHTML = '<div class="empty" style="padding-top:40vh">Harta nu s-a putut încărca. Reîncarcă pagina.</div>'; }
  buildChips();
  if (window.claude && claude.use) initDb(); else { S.dbOk = false; S.loaded = true; }
  if (ok) map.once('load', tryLocate);
}
if (window.maplibregl) boot();
else { const load = (src, next) => { const sc = document.createElement('script'); sc.src = src; sc.onload = boot; sc.onerror = next; document.head.appendChild(sc); };
  load('https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js', () => load('lib/maplibre-gl.js', boot)); }

</script>
